<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">StudioX Broadcasting Portal — Educational Stream Platform</text>
  
  <!-- Live Badge -->
  <rect x="640" y="34" width="110" height="22" rx="6" fill="rgba(236,72,153,0.2)" stroke="rgba(236,72,153,0.5)"/>
  <circle cx="653" cy="45" r="4" fill="#ef4444"/>
  <text x="663" y="49" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="800">LIVE BROADCAST</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.7)" stroke="rgba(236,72,153,0.3)" filter="url(#shadow)"/>

  <!-- Left Sidebar -->
  <rect x="45" y="90" width="150" height="320" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="115" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="900">STUDIOX</text>
  
  <rect x="55" y="135" width="130" height="30" rx="6" fill="url(#primary)"/>
  <text x="75" y="154" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🎥 Studio Live</text>
  
  <rect x="55" y="175" width="130" height="30" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="75" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Lecture Catalog</text>

  <rect x="55" y="215" width="130" height="30" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="75" y="234" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Video Assets</text>

  <rect x="55" y="255" width="130" height="30" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="75" y="274" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Stream Analytics</text>

  <!-- Video Streaming Center Screen -->
  <rect x="210" y="90" width="360" height="210" rx="10" fill="#060814" stroke="rgba(255,255,255,0.1)"/>
  
  <!-- Video Player Placeholder Graphics -->
  <rect x="220" y="100" width="340" height="150" rx="8" fill="rgba(30,27,75,0.6)"/>
  <!-- Play Icon Glow -->
  <circle cx="390" cy="175" r="28" fill="rgba(236,72,153,0.3)" stroke="#f472b6" stroke-width="2"/>
  <polygon points="383,163 403,175 383,187" fill="#ffffff"/>
  
  <!-- Video Bar Controls -->
  <rect x="220" y="260" width="340" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
  <rect x="230" y="272" width="160" height="6" rx="3" fill="#ec4899"/>
  <rect x="390" y="272" width="120" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <text x="520" y="278" fill="#e2e8f0" font-family="monospace" font-size="9">42:15 / 1:00:00</text>

  <!-- Viewer Counter Badge -->
  <rect x="220" y="315" width="360" height="95" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="235" y="338" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Lecture: Advanced Full Stack Architecture &amp; Zod Validation</text>
  <text x="235" y="358" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Instructor: Guddu Kumar · 2,480 Active Student Viewers</text>
  <rect x="235" y="370" width="85" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <text x="245" y="385" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">HD 1080p Stream</text>

  <!-- Right Zod Schema / Metadata Panel -->
  <rect x="585" y="90" width="170" height="320" rx="10" fill="rgba(139,92,246,0.06)" stroke="rgba(139,92,246,0.2)"/>
  <text x="600" y="115" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">⚡ Zod Form Guard</text>

  <rect x="595" y="130" width="150" height="45" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)"/>
  <text x="603" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Title Input</text>
  <text x="603" y="162" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Next.js 14 Streaming</text>

  <rect x="595" y="185" width="150" height="45" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)"/>
  <text x="603" y="201" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Validation Status</text>
  <text x="603" y="217" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Schema Passed</text>

  <rect x="595" y="240" width="150" height="120" rx="6" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  <text x="603" y="258" fill="#f472b6" font-family="monospace" font-size="8">const BroadcastSchema =</text>
  <text x="603" y="272" fill="#a5b4fc" font-family="monospace" font-size="8"> z.object({</text>
  <text x="611" y="286" fill="#cbd5e1" font-family="monospace" font-size="8"> title: z.string(),</text>
  <text x="611" y="300" fill="#cbd5e1" font-family="monospace" font-size="8"> isLive: z.boolean(),</text>
  <text x="603" y="314" fill="#a5b4fc" font-family="monospace" font-size="8"> });</text>
  <text x="603" y="338" fill="#34d399" font-family="monospace" font-size="8">✓ Validated!</text>
</svg>

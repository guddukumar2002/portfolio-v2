<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#ff5c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#ff7a59" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HubCraft — Custom HubSpot CMS Theme &amp; HubDB Dynamic Engine</text>
  
  <!-- Status Badge -->
  <rect x="630" y="34" width="120" height="22" rx="6" fill="rgba(255,122,89,0.2)" stroke="rgba(255,122,89,0.5)"/>
  <circle cx="645" cy="45" r="3" fill="#ff7a59"/>
  <text x="655" y="49" fill="#ff8f73" font-family="system-ui, sans-serif" font-size="10" font-weight="700">HUBSPOT CMS LIVE</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,122,89,0.3)" filter="url(#shadow)"/>

  <!-- Left Side 8 Sections List -->
  <rect x="45" y="90" width="220" height="320" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="115" fill="#ff7a59" font-family="system-ui, sans-serif" font-size="12" font-weight="900">HUBSPOT MODULES (8)</text>

  <rect x="55" y="130" width="200" height="28" rx="6" fill="url(#primary)"/>
  <text x="70" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1. Hero Banner Slider (Swiper.js)</text>

  <rect x="55" y="165" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="183" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">2. Three Column Box</text>

  <rect x="55" y="200" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="218" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">3. Parallax Background</text>

  <rect x="55" y="235" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="253" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">4. Popup Cards Modal</text>

  <rect x="55" y="270" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="288" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">5. Accordion / FAQ Section</text>

  <rect x="55" y="305" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="323" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">6. Custom Arrow Slider</text>

  <rect x="55" y="340" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="70" y="358" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">7. Tabber &amp; HubDB Resources</text>

  <!-- Right HubDB Engine & Code Display -->
  <rect x="280" y="90" width="475" height="320" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="295" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HubDB Relational Resource Library Query Engine</text>

  <!-- Code / HubL Query Box -->
  <rect x="295" y="130" width="445" height="150" rx="8" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  
  <text x="310" y="152" fill="#ff7a59" font-family="monospace" font-size="10" font-weight="700">{# HubL Server-Side HubDB Query #}</text>
  <text x="310" y="172" fill="#a5b4fc" font-family="monospace" font-size="9">{% set rows = hubdb_table_rows("resources",</text>
  <text x="325" y="188" fill="#34d399" font-family="monospace" font-size="9">"category__contains=" ~ request.query_param.cat %}</text>
  <text x="310" y="206" fill="#a5b4fc" font-family="monospace" font-size="9">{% for row in rows %}</text>
  <text x="325" y="222" fill="#cbd5e1" font-family="monospace" font-size="9">&lt;div class="resource-card"&gt;{{ row.name }}&lt;/div&gt;</text>
  <text x="310" y="240" fill="#a5b4fc" font-family="monospace" font-size="9">{% endfor %}</text>

  <!-- Live Demo CTA Bar -->
  <rect x="295" y="295" width="445" height="95" rx="8" fill="rgba(255,122,89,0.08)" stroke="rgba(255,122,89,0.2)"/>
  <text x="310" y="320" fill="#ff8f73" font-family="system-ui, sans-serif" font-size="12" font-weight="800">HubCraft Theme Preview</text>
  <text x="310" y="338" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Deployed on Netlify &amp; ready for HubSpot CLI (`hs upload`)</text>

  <rect x="310" y="350" width="160" height="28" rx="6" fill="url(#accent)"/>
  <text x="330" y="368" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">hubcraft-guddu.netlify.app</text>
</svg>

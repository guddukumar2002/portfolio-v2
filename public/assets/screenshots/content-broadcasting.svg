<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Teacher Content Broadcasting Engine — High Throughput Railway Microservice</text>
  
  <!-- Status Badge -->
  <rect x="630" y="34" width="120" height="22" rx="6" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)"/>
  <circle cx="645" cy="45" r="3" fill="#22d3ee"/>
  <text x="655" y="49" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">RAILWAY ONLINE</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(6,182,212,0.3)" filter="url(#shadow)"/>

  <!-- Metric Stat Cards Row -->
  <g transform="translate(45, 90)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="220" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="15" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CONCURRENT CLIENT DISPATCH</text>
    <text x="15" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="900">10,000+ Req/s</text>

    <!-- Stat 2 -->
    <rect x="245" y="0" width="220" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="260" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">STREAM LATENCY</text>
    <text x="260" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="900">&lt; 12 ms</text>

    <!-- Stat 3 -->
    <rect x="490" y="0" width="220" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="505" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SERVICE AVAILABILITY</text>
    <text x="505" y="48" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="20" font-weight="900">99.99% Uptime</text>
  </g>

  <!-- Architecture Flow Diagram -->
  <rect x="45" y="170" width="465" height="235" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Asynchronous Stream Chunk Management Architecture</text>

  <!-- Nodes -->
  <rect x="60" y="215" width="105" height="45" rx="8" fill="rgba(6,182,212,0.2)" stroke="#06b6d4"/>
  <text x="75" y="235" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Teacher Host</text>
  <text x="75" y="248" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="8">Stream Publisher</text>

  <line x1="165" y1="237" x2="195" y2="237" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>

  <rect x="195" y="215" width="145" height="45" rx="8" fill="rgba(16,185,129,0.2)" stroke="#10b981"/>
  <text x="210" y="235" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Express Chunk Queue</text>
  <text x="210" y="248" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">Role Middleware Guard</text>

  <line x1="340" y1="237" x2="370" y2="237" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>

  <rect x="370" y="215" width="125" height="45" rx="8" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6"/>
  <text x="385" y="235" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Student Clients</text>
  <text x="385" y="248" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="8">High-Speed Broadcast</text>

  <!-- Live Payload Preview Box -->
  <rect x="60" y="275" width="435" height="115" rx="8" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  <text x="75" y="295" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">[STREAM LOG] Chunk Dispatcher initialized</text>
  <text x="75" y="315" fill="#34d399" font-family="monospace" font-size="9">POST /api/v1/broadcast/publish 200 OK (84ms)</text>
  <text x="75" y="330" fill="#cbd5e1" font-family="monospace" font-size="9">{ "streamId": "str_908", "chunkSeq": 1042, "bitrate": "1080p" }</text>
  <text x="75" y="348" fill="#a855f7" font-family="monospace" font-size="9">✓ 2,400 WebSocket client subscribers synced without frame drop.</text>

  <!-- Right Panel: Railway Cloud Info -->
  <rect x="525" y="170" width="230" height="235" rx="10" fill="rgba(2,132,199,0.06)" stroke="rgba(2,132,199,0.2)"/>
  <text x="540" y="195" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">☁️ Railway Production Cloud</text>

  <rect x="535" y="210" width="210" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="548" y="227" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Deploy Domain</text>
  <text x="548" y="241" fill="#e2e8f0" font-family="monospace" font-size="9">content-broadcasting.up.railway.app</text>

  <rect x="535" y="260" width="210" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="548" y="277" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Server Memory</text>
  <text x="548" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">128 MB / 512 MB (Optimal)</text>

  <rect x="535" y="315" width="210" height="75" rx="6" fill="url(#primary)"/>
  <text x="555" y="345" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Live API Endpoint</text>
  <text x="555" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" opacity="0.9">Click to test REST &amp; WebSocket Endpoints</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Aanchal — Figma to Code Pixel-Perfect Saree &amp; Ethnic Fashion Web App</text>
  
  <!-- Status Badge -->
  <rect x="610" y="34" width="140" height="22" rx="6" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.5)"/>
  <circle cx="623" cy="45" r="3" fill="#f59e0b"/>
  <text x="633" y="49" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">FIGMA TO CODE 100%</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(28,25,23,0.85)" stroke="rgba(245,158,11,0.3)" filter="url(#shadow)"/>

  <!-- Top Fashion Header -->
  <rect x="45" y="90" width="710" height="45" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="60" y="117" fill="#fcd34d" font-family="Georgia, serif" font-size="15" font-weight="900">ÅANCHAL SILKS</text>
  <text x="400" y="117" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="10">Banarasi · Kanjeevaram · Chanderi · Handloom · New Arrivals</text>

  <!-- Hero Section Preview -->
  <rect x="45" y="150" width="450" height="260" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  
  <rect x="60" y="165" width="420" height="110" rx="8" fill="rgba(236,72,153,0.12)" stroke="rgba(236,72,153,0.3)"/>
  <text x="75" y="195" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-weight="900">Royal Heritage Saree Collection</text>
  <text x="75" y="215" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="10">Pixel-perfect Figma design conversion into responsive React Web Application.</text>
  
  <rect x="75" y="232" width="140" height="28" rx="6" fill="url(#primary)"/>
  <text x="96" y="250" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Explore Collection</text>

  <!-- Saree Product Cards Row -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="130" height="100" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="10" y="25" fill="#fcd34d" font-family="Georgia, serif" font-size="10" font-weight="700">Banarasi Silk</text>
    <text x="10" y="45" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">Zari Weave · ₹14,999</text>
    <rect x="10" y="60" width="110" height="22" rx="4" fill="url(#accent)"/>
    <text x="28" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">View Product</text>

    <rect x="145" y="0" width="130" height="100" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="155" y="25" fill="#fcd34d" font-family="Georgia, serif" font-size="10" font-weight="700">Kanjeevaram</text>
    <text x="155" y="45" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">Pure Gold Thread</text>
    <rect x="155" y="60" width="110" height="22" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="173" y="74" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="8" font-weight="700">View Product</text>

    <rect x="290" y="0" width="130" height="100" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="300" y="25" fill="#fcd34d" font-family="Georgia, serif" font-size="10" font-weight="700">Chanderi Craft</text>
    <text x="300" y="45" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">Lightweight Elegance</text>
    <rect x="300" y="60" width="110" height="22" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="318" y="74" fill="#e7e5e4" font-family="system-ui, sans-serif" font-size="8" font-weight="700">View Product</text>
  </g>

  <!-- Right Figma to Code Metrics Panel -->
  <rect x="510" y="150" width="245" height="260" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.2)"/>
  <text x="525" y="175" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="800">📐 Figma to Code Specs</text>

  <rect x="525" y="195" width="215" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="535" y="212" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">Target Design</text>
  <text x="535" y="226" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Aanchal Saree Fashion Figma UI</text>

  <rect x="525" y="245" width="215" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="535" y="262" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="8">Fidelity</text>
  <text x="535" y="276" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">100% Pixel-Perfect Layout</text>

  <rect x="525" y="300" width="215" height="95" rx="6" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  <text x="535" y="320" fill="#f59e0b" font-family="monospace" font-size="8">// Figma Token System</text>
  <text x="535" y="335" fill="#a5b4fc" font-family="monospace" font-size="8">colors: { gold: '#f59e0b',</text>
  <text x="543" y="350" fill="#cbd5e1" font-family="monospace" font-size="8">  sareeRed: '#be185d' }</text>
  <text x="535" y="365" fill="#34d399" font-family="monospace" font-size="8">✓ Fully Responsive Grid</text>
  <text x="535" y="380" fill="#a5b4fc" font-family="monospace" font-size="8">✓ Vercel SPA Routing</text>
</svg>

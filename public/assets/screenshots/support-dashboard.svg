<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Top App Window Bar -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Customer Support Ops Dashboard — Real-Time Ticket Control Center</text>

  <!-- Content Grid -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.8)" stroke="rgba(59,130,246,0.3)"/>

  <!-- Metric Badges Row -->
  <rect x="50" y="95" width="160" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="65" y="115" fill="#94a3b8" font-family="system-ui" font-size="10">Total Tickets</text>
  <text x="65" y="145" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="900">1,284</text>

  <rect x="220" y="95" width="160" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="235" y="115" fill="#94a3b8" font-family="system-ui" font-size="10">SLA Breach Risk</text>
  <text x="235" y="145" fill="#ef4444" font-family="system-ui" font-size="22" font-weight="900">0.4%</text>

  <rect x="390" y="95" width="160" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="405" y="115" fill="#94a3b8" font-family="system-ui" font-size="10">Avg Resolution</text>
  <text x="405" y="145" fill="#34d399" font-family="system-ui" font-size="22" font-weight="900">14 mins</text>

  <rect x="560" y="95" width="190" height="65" rx="8" fill="url(#primary)"/>
  <text x="575" y="125" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800">📥 Export Ticket CSV</text>
  <text x="575" y="145" fill="#bfdbfe" font-family="system-ui" font-size="10">Zustand State Engine</text>

  <!-- Ticket Table View -->
  <rect x="50" y="175" width="700" height="230" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)"/>
  
  <!-- Table Header -->
  <rect x="60" y="185" width="680" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="75" y="204" fill="#a5b4fc" font-family="system-ui" font-size="10" font-weight="700">TICKET ID</text>
  <text x="160" y="204" fill="#a5b4fc" font-family="system-ui" font-size="10" font-weight="700">CUSTOMER</text>
  <text x="310" y="204" fill="#a5b4fc" font-family="system-ui" font-size="10" font-weight="700">SUBJECT</text>
  <text x="490" y="204" fill="#a5b4fc" font-family="system-ui" font-size="10" font-weight="700">PRIORITY</text>
  <text x="610" y="204" fill="#a5b4fc" font-family="system-ui" font-size="10" font-weight="700">STATUS</text>

  <!-- Table Row 1 -->
  <text x="75" y="235" fill="#60a5fa" font-family="monospace" font-size="10">#TK-9081</text>
  <text x="160" y="235" fill="#ffffff" font-family="system-ui" font-size="11">Acme Logistics</text>
  <text x="310" y="235" fill="#cbd5e1" font-family="system-ui" font-size="11">Webhook failure on batch dispatch</text>
  <rect x="490" y="222" width="55" height="18" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444"/>
  <text x="500" y="234" fill="#f87171" font-family="system-ui" font-size="9" font-weight="700">URGENT</text>
  <rect x="610" y="222" width="60" height="18" rx="4" fill="rgba(52,211,153,0.2)" stroke="#34d399"/>
  <text x="622" y="234" fill="#6ee7b7" font-family="system-ui" font-size="9" font-weight="700">RESOLVED</text>

  <!-- Table Row 2 -->
  <text x="75" y="275" fill="#60a5fa" font-family="monospace" font-size="10">#TK-9082</text>
  <text x="160" y="275" fill="#ffffff" font-family="system-ui" font-size="11">Apex Capital</text>
  <text x="310" y="275" fill="#cbd5e1" font-family="system-ui" font-size="11">Invoice PDF download error</text>
  <rect x="490" y="262" width="50" height="18" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b"/>
  <text x="500" y="274" fill="#fbbf24" font-family="system-ui" font-size="9" font-weight="700">HIGH</text>
  <rect x="610" y="262" width="60" height="18" rx="4" fill="rgba(59,130,246,0.2)" stroke="#3b82f6"/>
  <text x="620" y="274" fill="#93c5fd" font-family="system-ui" font-size="9" font-weight="700">IN PROGRESS</text>
</svg>

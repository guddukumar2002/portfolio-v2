<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Vignam — Interactive EdTech Platform &amp; Learning Hub</text>
  
  <!-- Status Badge -->
  <rect x="630" y="34" width="120" height="22" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)"/>
  <circle cx="645" cy="45" r="3" fill="#38bdf8"/>
  <text x="655" y="49" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">EDTECH LIVE</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(59,130,246,0.3)" filter="url(#shadow)"/>

  <!-- Hero Section Preview -->
  <rect x="45" y="90" width="710" height="110" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  
  <text x="65" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="900">Transforming Science &amp; Tech Education</text>
  <text x="65" y="145" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Empowering students with interactive 3D simulations, real-time lab experiments, and STEM courses.</text>

  <rect x="65" y="160" width="130" height="30" rx="6" fill="url(#primary)"/>
  <text x="88" y="179" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Explore Courses</text>

  <rect x="205" y="160" width="130" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="235" y="179" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Watch Demo</text>

  <!-- Course Cards Grid Row -->
  <!-- Card 1 -->
  <rect x="45" y="215" width="225" height="195" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="55" y="225" width="205" height="75" rx="6" fill="rgba(56,189,248,0.15)"/>
  <text x="65" y="265" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Physics 3D Lab</text>
  <text x="65" y="320" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Interactive Optics</text>
  <text x="65" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">12 Modules · 4.9 ⭐ (1.2k Students)</text>
  <rect x="65" y="360" width="185" height="35" rx="6" fill="url(#accent)"/>
  <text x="110" y="382" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Start Module</text>

  <!-- Card 2 -->
  <rect x="285" y="215" width="225" height="195" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="295" y="225" width="205" height="75" rx="6" fill="rgba(168,85,247,0.15)"/>
  <text x="305" y="265" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Web Development</text>
  <text x="305" y="320" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">React &amp; TypeScript</text>
  <text x="305" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">24 Modules · 5.0 ⭐ (3.4k Students)</text>
  <rect x="295" y="360" width="185" height="35" rx="6" fill="url(#primary)"/>
  <text x="340" y="382" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Enroll Now</text>

  <!-- Card 3 -->
  <rect x="525" y="215" width="230" height="195" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="535" y="225" width="210" height="75" rx="6" fill="rgba(16,185,129,0.15)"/>
  <text x="545" y="265" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Chemistry &amp; STEM</text>
  <text x="545" y="320" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Molecular Reaction</text>
  <text x="545" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">18 Modules · 4.8 ⭐ (2.1k Students)</text>
  <rect x="535" y="360" width="210" height="35" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="590" y="382" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">View Details</text>
</svg>

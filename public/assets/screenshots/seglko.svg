<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="700">seglko.org — Saroj Educational Group Main Institution Platform</text>
  
  <!-- Status Badge -->
  <rect x="620" y="34" width="130" height="22" rx="6" fill="rgba(20,184,166,0.15)" stroke="rgba(20,184,166,0.4)"/>
  <circle cx="633" cy="45" r="3" fill="#14b8a6"/>
  <text x="643" y="49" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SEGLKO.ORG LIVE</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(20,184,166,0.3)" filter="url(#shadow)"/>

  <!-- Top Institutional Header -->
  <rect x="45" y="90" width="710" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="60" y="120" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="14" font-weight="900">SAROJ EDUCATIONAL GROUP</text>
  
  <text x="360" y="120" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Home · Colleges · Admissions · Academics · Placement · Contact</text>

  <!-- Hero Section Banner -->
  <rect x="45" y="150" width="460" height="260" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  
  <rect x="60" y="165" width="430" height="110" rx="8" fill="rgba(20,184,166,0.1)" stroke="rgba(20,184,166,0.2)"/>
  <text x="75" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900">Empowering Future Engineers &amp; Leaders</text>
  <text x="75" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Saroj Educational Group Lucknow — Approved by AICTE &amp; Affiliated to AKTU.</text>
  
  <rect x="75" y="232" width="120" height="28" rx="6" fill="url(#primary)"/>
  <text x="94" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Apply for 2026</text>

  <!-- College Microsite Cards Grid -->
  <text x="60" y="295" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="800">CAMPUS MICROSITES (/ssitm, /sitm)</text>
  
  <rect x="60" y="308" width="205" height="85" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="70" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SSITM Aligarh</text>
  <text x="70" y="348" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Engineering &amp; Management</text>
  <text x="70" y="365" fill="#14b8a6" font-family="monospace" font-size="8">seglko.org/ssitm</text>

  <rect x="285" y="308" width="205" height="85" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="295" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SITM Lucknow</text>
  <text x="295" y="348" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Institute of Tech &amp; Management</text>
  <text x="295" y="365" fill="#14b8a6" font-family="monospace" font-size="8">seglko.org/sitm</text>

  <!-- Right Side SEO & Rewrites Panel -->
  <rect x="520" y="150" width="235" height="260" rx="10" fill="rgba(20,184,166,0.06)" stroke="rgba(20,184,166,0.2)"/>
  <text x="535" y="175" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="800">⚙️ Vercel Rewrites &amp; SEO</text>

  <rect x="535" y="190" width="205" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="545" y="207" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Primary Domain</text>
  <text x="545" y="221" fill="#ffffff" font-family="monospace" font-size="9">https://seglko.org</text>

  <rect x="535" y="240" width="205" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="545" y="257" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Sitemap Indexing</text>
  <text x="545" y="271" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Google Verified</text>

  <rect x="535" y="295" width="205" height="100" rx="6" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  <text x="545" y="315" fill="#f59e0b" font-family="monospace" font-size="8">// vercel.json rewrites</text>
  <text x="545" y="330" fill="#a5b4fc" font-family="monospace" font-size="8">"rewrites": [</text>
  <text x="553" y="345" fill="#cbd5e1" font-family="monospace" font-size="8">  { "source": "/sitm",</text>
  <text x="553" y="360" fill="#34d399" font-family="monospace" font-size="8">    "destination": "..." }</text>
  <text x="545" y="375" fill="#a5b4fc" font-family="monospace" font-size="8">]</text>
</svg>

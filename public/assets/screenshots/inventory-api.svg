<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Inventory &amp; Order Management REST API — Enterprise MongoDB Microservice</text>
  
  <!-- Status Badge -->
  <rect x="620" y="34" width="130" height="22" rx="6" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)"/>
  <circle cx="633" cy="45" r="3" fill="#f59e0b"/>
  <text x="643" y="49" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ACID TRANSACTIONS</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(245,158,11,0.3)" filter="url(#shadow)"/>

  <!-- Left Sidebar API Endpoints List -->
  <rect x="45" y="90" width="200" height="320" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="115" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="900">API ROUTE DIRECTORY</text>

  <!-- Endpoint 1 -->
  <rect x="55" y="130" width="180" height="40" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
  <rect x="62" y="142" width="36" height="16" rx="3" fill="#10b981"/>
  <text x="66" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">POST</text>
  <text x="104" y="154" fill="#e2e8f0" font-family="monospace" font-size="9">/orders/checkout</text>

  <!-- Endpoint 2 -->
  <rect x="55" y="180" width="180" height="40" rx="6" fill="rgba(59,130,246,0.1)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="62" y="192" width="30" height="16" rx="3" fill="#3b82f6"/>
  <text x="67" y="203" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">GET</text>
  <text x="98" y="204" fill="#94a3b8" font-family="monospace" font-size="9">/inventory/stock</text>

  <!-- Endpoint 3 -->
  <rect x="55" y="230" width="180" height="40" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="62" y="242" width="28" height="16" rx="3" fill="#f59e0b"/>
  <text x="67" y="253" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">PUT</text>
  <text x="96" y="254" fill="#94a3b8" font-family="monospace" font-size="9">/inventory/lock</text>

  <!-- Endpoint 4 -->
  <rect x="55" y="280" width="180" height="40" rx="6" fill="rgba(239,68,68,0.1)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="62" y="292" width="45" height="16" rx="3" fill="#ef4444"/>
  <text x="65" y="303" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">DELETE</text>
  <text x="112" y="304" fill="#94a3b8" font-family="monospace" font-size="9">/orders/:id</text>

  <!-- JWT Security Badge -->
  <rect x="55" y="340" width="180" height="55" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="65" y="360" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🔒 JWT Middleware Guard</text>
  <text x="65" y="376" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Bearer Token Auth &amp; Role-Based AC</text>

  <!-- Right Panel API Request / Response Sandbox -->
  <rect x="260" y="90" width="495" height="320" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="275" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MongoDB Atomic Transaction &amp; Stock Lock Execution</text>

  <!-- Code / JSON Response -->
  <rect x="275" y="130" width="465" height="260" rx="8" fill="#04040c" stroke="rgba(255,255,255,0.1)"/>
  
  <text x="290" y="152" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">HTTP/1.1 201 Created — Transaction Committed</text>
  <text x="290" y="172" fill="#a5b4fc" font-family="monospace" font-size="9">{</text>
  <text x="305" y="190" fill="#fcd34d" font-family="monospace" font-size="9">"status": "success",</text>
  <text x="305" y="208" fill="#cbd5e1" font-family="monospace" font-size="9">"transactionId": "tx_mongo_908812a",</text>
  <text x="305" y="226" fill="#cbd5e1" font-family="monospace" font-size="9">"order": { "id": "ord_881", "total": 149.99, "items": 3 },</text>
  <text x="305" y="244" fill="#38bdf8" font-family="monospace" font-size="9">"stockLockToken": "sl_active_881",</text>
  <text x="305" y="262" fill="#34d399" font-family="monospace" font-size="9">"inventoryDeducted": true,</text>
  <text x="305" y="280" fill="#cbd5e1" font-family="monospace" font-size="9">"timestamp": "2026-09-22T15:37:00.000Z"</text>
  <text x="290" y="298" fill="#a5b4fc" font-family="monospace" font-size="9">}</text>

  <rect x="290" y="315" width="435" height="55" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
  <text x="300" y="335" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">⚡ Zero Race Conditions</text>
  <text x="300" y="352" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">MongoDB Session ACID locks prevent inventory overshoot during high concurrency spikes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="55" cy="45" r="5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Multi-Tenant URL Shortener Engine — Analytics &amp; High-Speed Link Router</text>
  
  <!-- Status Badge -->
  <rect x="630" y="34" width="120" height="22" rx="6" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)"/>
  <circle cx="645" cy="45" r="3" fill="#22d3ee"/>
  <text x="655" y="49" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">&lt; 10MS REDIRECT</text>

  <!-- Main Container -->
  <rect x="30" y="75" width="740" height="350" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(59,130,246,0.3)" filter="url(#shadow)"/>

  <!-- Top Shortener Form Input Box -->
  <rect x="45" y="90" width="710" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  
  <rect x="60" y="105" width="480" height="40" rx="8" fill="#04040c" stroke="rgba(255,255,255,0.15)"/>
  <text x="75" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://guddukumar-dev.vercel.app/projects/aivoa-complaint-system-long-link</text>
  
  <rect x="550" y="105" width="120" height="40" rx="8" fill="url(#primary)"/>
  <text x="575" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Shorten URL</text>

  <rect x="680" y="105" width="60" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="693" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Copy</text>

  <!-- Middle Generated Short Link Result Bar -->
  <rect x="45" y="170" width="710" height="40" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
  <text x="60" y="195" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">✓ Shortened Link Generated: https://lnk.dev/gk-aivoa</text>
  <text x="580" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Base62 Hash Encoded</text>

  <!-- Analytics Chart Section -->
  <rect x="45" y="225" width="450" height="185" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="250" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Real-Time Click Impression Analytics</text>

  <!-- Bar Chart Representation -->
  <g transform="translate(60, 270)">
    <!-- Bar 1 -->
    <rect x="10" y="60" width="35" height="60" rx="4" fill="#38bdf8"/>
    <text x="18" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Mon</text>

    <!-- Bar 2 -->
    <rect x="70" y="35" width="35" height="85" rx="4" fill="#3b82f6"/>
    <text x="78" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Tue</text>

    <!-- Bar 3 -->
    <rect x="130" y="20" width="35" height="100" rx="4" fill="#6366f1"/>
    <text x="138" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Wed</text>

    <!-- Bar 4 -->
    <rect x="190" y="45" width="35" height="75" rx="4" fill="#8b5cf6"/>
    <text x="198" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Thu</text>

    <!-- Bar 5 -->
    <rect x="250" y="10" width="35" height="110" rx="4" fill="#ec4899"/>
    <text x="258" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Fri</text>

    <!-- Bar 6 -->
    <rect x="310" y="25" width="35" height="95" rx="4" fill="#34d399"/>
    <text x="318" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Sat</text>

    <!-- Bar 7 -->
    <rect x="370" y="5" width="35" height="115" rx="4" fill="url(#primary)"/>
    <text x="378" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Sun</text>
  </g>

  <!-- Right Geo Breakdown & Multi-Tenant Panel -->
  <rect x="510" y="225" width="245" height="185" rx="10" fill="rgba(139,92,246,0.06)" stroke="rgba(139,92,246,0.2)"/>
  <text x="525" y="250" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">📊 Tenant Performance</text>

  <rect x="525" y="265" width="215" height="35" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="535" y="286" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Total Short Links: <tspan fill="#34d399" font-weight="700">14,290</tspan></text>

  <rect x="525" y="310" width="215" height="35" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="535" y="331" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Total Click Redirects: <tspan fill="#38bdf8" font-weight="700">128,450</tspan></text>

  <rect x="525" y="355" width="215" height="40" rx="6" fill="url(#accent)"/>
  <text x="545" y="380" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">⚡ Multi-Tenant Isolated DB</text>
</svg>
